# AI Chief of Staff Configuration File

# User Profile
user:
  name: "Jane Doe"
  email: "jane.doe@company.com"
  timezone: "America/Los_Angeles"
  title: "Chief Product Officer"

  # Communication preferences
  communication:
    tone: "professional"  # professional, casual, friendly
    style: "concise"      # concise, detailed, balanced
    signature: |
      Best regards,
      Jane Doe
      Chief Product Officer

# Triage Configuration
# Coco pre-processes emails twice daily and surfaces results in an
# interactive Claude Code session. No emails are sent or deleted automatically.
triage:
  # Noon run: covers midnight → 11:59am
  noon_run:
    enabled: true
    time: "12:00"  # 24-hour format in user's timezone

  # Afternoon run: covers 12:00 → 3:59pm, flags EOD-urgent items
  afternoon_run:
    enabled: true
    time: "16:00"
    flag_eod_urgency: true  # Marks items needing same-day action

  # Notification email sent when pre-processing completes
  notification_email:
    enabled: true
    recipient: "jane.doe@company.com"

  # Junk handling
  junk:
    # Confidence threshold above which junk is auto-queued (not shown individually)
    auto_queue_threshold: 0.95
    # Remember confirmed junk senders to skip API call next time
    sender_memory: true

  # Newsletter settings
  newsletters:
    # Deduplicate stories appearing in multiple newsletters
    deduplicate_across_sources: true
    # Track which newsletters you engage with for subscription quality scoring
    track_engagement: true
    engagement_review_weeks: 4  # Surface low-engagement newsletters after N weeks

  # Draft generation
  drafts:
    # Number of draft options to generate per action email
    options_count: 3  # short ACK, full reply, decline/defer
    save_to_gmail_drafts: true  # Never sent automatically

  # Limits per run
  max_junk_suggestions: 20
  max_newsletter_summaries: 10
  max_action_emails: 15

# Gmail Integration
integrations:
  gmail:
    enabled: true

    # Sync settings
    sync_interval_minutes: 15
    initial_sync_days: 30
    max_results_per_sync: 100

    # Filters
    include_labels:
      - "INBOX"
      - "IMPORTANT"

    exclude_labels:
      - "SPAM"
      - "TRASH"

    # What to prioritize
    priority_senders:
      - "ceo@company.com"
      - "board@company.com"

    priority_keywords:
      - "urgent"
      - "decision needed"
      - "roadmap"
      - "strategy"

    # System notification sender domains — parsed structurally, not sent to Claude
    system_notification_senders:
      concur:
        - "@concur.com"
        - "noreply@concursolutions.com"
      sap:
        - "@sap.com"
      bob:
        - "@hibob.com"
        - "noreply@hibob.com"
      asana:
        - "noreply@asana.com"
        - "mail@asana.com"

  # Google Calendar Integration
  calendar:
    enabled: true

    # Sync settings
    sync_interval_minutes: 30
    lookahead_days: 7
    lookback_days: 1  # For extracting meeting follow-ups

    # Calendar IDs to sync (use "primary" for main calendar)
    calendars:
      - "primary"

    # Extract action items from these types of meetings
    extract_actions_from:
      - "1:1"
      - "team meeting"
      - "planning"
      - "review"

  # Coda Integration
  coda:
    enabled: true

    # Sync settings
    sync_interval_minutes: 60

    # Documents to track
    tracked_docs:
      - id: "abc123xyz"
        name: "Product Roadmap Q1 2026"
        type: "roadmap"
        priority: "high"

      - id: "def456uvw"
        name: "Engineering OKRs 2026"
        type: "okrs"
        priority: "high"

      - id: "ghi789rst"
        name: "Product Strategy"
        type: "strategy"
        priority: "high"

    # Change detection
    track_changes: true
    summarize_changes: true

# AI/LLM Configuration
ai:
  provider: "anthropic"
  model: "claude-3-5-sonnet-20241022"

  # Generation settings
  max_tokens: 4000
  temperature: 0.7

  # Caching
  enable_caching: true
  cache_ttl_hours: 24

  # Cost management
  track_usage: true
  monthly_budget_usd: 100  # Alert if approaching this

  # Model selection by task
  # Haiku for high-volume, cheap tasks. Sonnet for quality-sensitive tasks.
  models:
    classification: "claude-haiku-4-5-20251001"       # Runs on every email
    system_notification: "claude-haiku-4-5-20251001"  # Fallback only; usually heuristic
    junk_detection: "claude-haiku-4-5-20251001"
    newsletter_summary: "claude-sonnet-4-6"
    email_draft: "claude-sonnet-4-6"
    context_synthesis: "claude-sonnet-4-6"

# Data Storage
storage:
  # Database
  database_path: "./data/coco.db"
  enable_encryption: true

  # Obsidian vault integration
  obsidian_vault_path: "/Users/akenall/Documents/Obsidian Vault"
  obsidian_backlog_file: "tasks/Backlog.md"  # Relative to vault root
  obsidian_task_tag: "#coco"                 # Added to all Coco-created tasks

  # Vector store
  vector_store_path: "./data/vectors"
  embedding_model: "text-embedding-3-small"

  # Backups
  backup_enabled: true
  backup_path: "./backups"
  backup_interval_hours: 24
  backup_retention_days: 30

  # Data retention
  retention:
    emails_days: 90
    calendar_events_days: 60
    triage_sessions_days: 30
    decisions_days: null  # Keep forever

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json or text
  output: "both"  # file, console, or both

  # File logging
  file:
    path: "./logs/app.log"
    rotation: "daily"  # daily, weekly, size
    max_size_mb: 100  # If rotation = size
    retention_days: 30

  # What to log
  log_api_calls: true
  log_ai_prompts: false  # Set to true for debugging
  log_ai_responses: false

# Monitoring & Metrics
monitoring:
  enable_metrics: true
  metrics_port: 9090

  # Health checks
  health_check_interval_minutes: 15

  # Alerts
  alerts:
    email_on_failure: true
    alert_email: "jane.doe@company.com"

# Scheduler
scheduler:
  timezone: "America/Los_Angeles"

  jobs:
    # Triage pre-processing (replaces single daily briefing)
    noon_triage:
      enabled: true
      time: "12:00"
      retry_on_failure: true
      max_retries: 3

    afternoon_triage:
      enabled: true
      time: "16:00"
      retry_on_failure: true
      max_retries: 3

    # Background sync jobs (existing)
    gmail_sync:
      enabled: true
      interval_minutes: 15

    calendar_sync:
      enabled: true
      interval_minutes: 30

    coda_sync:
      enabled: true
      interval_minutes: 60

    database_backup:
      enabled: true
      time: "02:00"

# Feature Flags
features:
  # Phase 3
  email_classification: true
  junk_detection: true
  system_notification_parsing: true
  newsletter_summarization: true
  email_draft_generation: true
  obsidian_task_writing: true

  # Phase 4
  triage_session_state: false     # Coming in Phase 4
  gmail_draft_saving: false       # Coming in Phase 4

  # Phase 6
  junk_sender_memory: false       # Coming in Phase 6
  newsletter_engagement_tracking: false
  weekly_summaries: false
  web_ui: false

# Advanced Settings
advanced:
  # Performance
  max_concurrent_api_calls: 5
  request_timeout_seconds: 30

  # Email processing
  max_thread_depth: 20
  ignore_automated_emails: true

  # Context window management
  max_context_tokens: 100000
  context_compression: true

  # Feedback
  collect_feedback: true
  feedback_retention_days: 365
