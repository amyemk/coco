[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Coverage
addopts =
    --strict-markers
    --verbose
    --color=yes

markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests

# Ignore
norecursedirs =
    .git
    .venv
    venv
    build
    dist
    *.egg
